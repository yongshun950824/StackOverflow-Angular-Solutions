<h4>Basic mat-select with initial value</h4>
<form [formGroup]="form">
  <mat-form-field>
    <mat-label>Favorite Food</mat-label>
    <mat-select
      formControlName="managers"
      multiple
      [compareWith]="compareSelectOptions"
    >
      <!-- <mat-option></mat-option> -->
      @for (x of empNames; track x._id) {
      <mat-option [value]="x._id">{{ x.fullName }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
</form>

{{ form.value.managers | json }}
